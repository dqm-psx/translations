name: Test translation comparison

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 tools/donor_source_audit.py
      - run: npx playwright install --with-deps chromium
      - run: npm test
